<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meritve UNI</title>
<style>
  /* Barvna shema – spremeni tukaj, če želiš točno ujemanje s PDF-ji */
  :root {
    --primary: #1f4e79;
    --primary-dark: #14344f;
    --accent: #e8a33d;
    --bg: #f3f6fa;
    --card: #ffffff;
    --text: #1d2733;
    --muted: #6b7a8c;
    --border: #d9e2ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: #fff;
    text-align: center;
    padding: 48px 20px 64px;
    border-bottom: 4px solid var(--accent);
  }
  header h1 { margin: 0 0 6px; font-size: 2.4rem; letter-spacing: .5px; }
  header p { margin: 0; opacity: .85; font-size: 1.05rem; }
  main { max-width: 760px; margin: -32px auto 48px; padding: 0 16px; }
  .tabs {
    display: flex; gap: 8px; justify-content: center;
    background: var(--card); padding: 8px; border-radius: 14px;
    box-shadow: 0 6px 20px rgba(20,52,79,.12);
    margin-bottom: 24px;
  }
  .tab {
    flex: 1; padding: 12px 16px; border: none; border-radius: 10px;
    background: transparent; color: var(--primary);
    font-size: 1.05rem; font-weight: 600; cursor: pointer;
    transition: background .2s, color .2s;
  }
  .tab:hover { background: #e6eef6; }
  .tab.active { background: var(--primary); color: #fff; }
  .view { display: none; }
  .view.active { display: block; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); color: var(--text); text-decoration: none;
    padding: 14px 18px; border-radius: 12px;
    border: 1px solid var(--border); border-left: 5px solid var(--primary);
    transition: transform .15s, box-shadow .15s, border-left-color .15s;
    word-break: break-word;
  }
  .item:hover {
    transform: translateX(4px);
    box-shadow: 0 4px 14px rgba(20,52,79,.12);
    border-left-color: var(--accent);
  }
  .item .icon { font-size: 1.2rem; color: var(--accent); }
  .item .name { font-weight: 500; }
  .item .ext { margin-left: auto; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .big { justify-content: center; padding: 22px; font-size: 1.15rem; font-weight: 600; background: var(--primary); color: #fff; border-left-color: var(--accent); }
  .big:hover { background: var(--primary-dark); }
  footer { text-align: center; color: var(--muted); font-size: .85rem; padding-bottom: 32px; }
</style>
</head>
<body>
<header>
  <h1>Meritve UNI</h1>
  <p>Rešene tipske izpitne naloge</p>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-view="izpit">Izpit</button>
    <button class="tab" data-view="ustni">Ustni</button>
  </div>

  <section id="izpit" class="view active">
    <div class="list" id="izpit-list"></div>
  </section>

  <section id="ustni" class="view">
    <div class="list">
      <a class="item big" href="dokumenti/Meritve_priprava_na_ustni_izpit_v2.pdf" target="_blank" rel="noopener">Priprava na ustni</a>
    </div>
  </section>
</main>

<footer>Meritve UNI</footer>

<script>
  const files = [
    "TIP1_sistematicni_pogresek_prikljucitve",
    "TIP2_dinamika_clena_1_reda",
    "TIP3_ENOD",
    "TIP4_Wheatstonov_mostic",
    "TIP5_kvantni_etaloni",
    "TIP6_referencno_nazivno_obmocje",
    "TIP7_primerjalna_metoda",
    "TIP8_efektivne_stopnje_prostosti",
    "TIP9_efektivna_vrednost_pulza",
    "TIP10_negotovost_tipa_A_ENOD",
    "TIP11_umerjanje_kalibracija",
    "TIP12_budget_negotovosti",
    "TIP13_kotni_pogresek_moci",
    "TIP14_faktor_popacenja_THD",
    "TIP15_razsirjena_negotovost",
    "TIP16_pogresek_zaokrozanja",
    "TIP17_osnovne_velicine_SI",
    "TIP18_informacijski_pretok",
    "TIP20_diferencna_metoda",
    "TIP21-24_preostale_naloge"
  ];

  const list = document.getElementById("izpit-list");
  files.forEach(name => {
    const a = document.createElement("a");
    a.className = "item";
    a.href = "dokumenti/Meritve_" + name + ".pdf";
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = '<span class="icon">&#128196;</span><span class="name"></span><span class="ext">pdf</span>';
    a.querySelector(".name").textContent = name;
    list.appendChild(a);
  });

  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.view).classList.add("active");
    });
  });
</script>
</body>
</html>
